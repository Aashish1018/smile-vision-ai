# Treatment catalog: the closed vocabulary the care-plan agent must choose from.
# `addresses` links treatments to screening categories (see smileos/vision/schemas.py).
# `requires_exam` treatments are never proposed as cosmetic-only options.
# `kb` is the slug of the knowledge article that explains the treatment.

treatments:
  EXAM:
    name: Comprehensive dental examination
    addresses: []
    unit: visit
    kb: prevention-and-aftercare
    duration: 1 visit
  CLEAN:
    name: Professional cleaning (scale and polish)
    addresses: [plaque_or_calculus, discoloration, gum_inflammation]
    unit: visit
    kb: professional-cleaning
    duration: 1 visit
  SRP:
    name: Deep cleaning (scaling and root planing)
    addresses: [gum_inflammation, gum_recession, plaque_or_calculus]
    unit: quadrant
    kb: gum-disease
    duration: 2-4 visits
    requires_exam: true
  WHITEN_OFFICE:
    name: In-office whitening
    addresses: [discoloration]
    unit: course
    kb: teeth-whitening
    duration: 1-2 visits
  WHITEN_HOME:
    name: Dentist-supervised home whitening
    addresses: [discoloration]
    unit: course
    kb: teeth-whitening
    duration: 2-4 weeks
  BONDING:
    name: Composite bonding
    addresses: [chipped_or_worn, spacing, discoloration]
    unit: tooth
    kb: dental-bonding
    duration: 1 visit
  VENEER:
    name: Porcelain veneer
    addresses: [discoloration, chipped_or_worn, spacing, misalignment]
    unit: tooth
    kb: porcelain-veneers
    duration: 2-3 visits over 2-4 weeks
  CROWN:
    name: Crown
    addresses: [chipped_or_worn, visible_decay]
    unit: tooth
    kb: dental-crowns
    duration: 2 visits
    requires_exam: true
  ALIGNERS:
    name: Clear aligners
    addresses: [misalignment, crowding, spacing]
    unit: course
    kb: clear-aligners
    duration: 6-18 months
  BRACES:
    name: Fixed braces
    addresses: [misalignment, crowding, spacing]
    unit: course
    kb: braces
    duration: 12-24 months
  FILLING:
    name: Tooth-coloured filling
    addresses: [visible_decay]
    unit: tooth
    kb: fillings-and-tooth-decay
    duration: 1 visit
    requires_exam: true
  RCT:
    name: Root canal treatment
    addresses: [visible_decay]
    unit: tooth
    kb: root-canal-treatment
    duration: 1-3 visits
    requires_exam: true
  IMPLANT:
    name: Implant with crown
    addresses: [missing_tooth]
    unit: tooth
    kb: dental-implants
    duration: 3-6 months
    requires_exam: true
  BRIDGE:
    name: Bridge (per unit)
    addresses: [missing_tooth]
    unit: tooth
    kb: dental-implants
    duration: 2 visits
    requires_exam: true
  SPECIALIST_REFERRAL:
    name: In-person soft-tissue examination / specialist referral
    addresses: [soft_tissue_lesion]
    unit: visit
    kb: mouth-cancer-warning-signs
    duration: as soon as possible
    requires_exam: true

