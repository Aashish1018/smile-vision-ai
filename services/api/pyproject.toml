[project]
name = "smileos-api"
version = "0.1.0"
description = "SmileOS AI service: dental screening, RAG and care-plan agents"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "email-validator>=2.3.0",
    "fastapi>=0.162.0",
    "fastembed>=0.9.1",
    "httpx>=0.28.1",
    "langgraph>=1.2.19",
    "langgraph-checkpoint-postgres>=3.2.0",
    "mcp>=2.3.0",
    "numpy>=2.5.4",
    "openai>=3.42.1",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-sdk>=1.45.2",
    "pgvector>=0.5.1",
    "pillow>=13.0.0",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.16.2",
    "pyjwt[crypto]>=2.15.1",
    "python-multipart>=0.0.33",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
    "sqlalchemy[asyncio]>=2.0",
    "sse-starlette>=3.6.0",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
smileos-ingest = "smileos.rag.ingest:main"
smileos-mcp = "smileos.mcp.server:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "smileos"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "S", "RUF", "PTH"]
ignore = ["S101", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PTH", "E501"]
"evals/**" = ["S", "T20"]

[tool.ruff.lint.isort]
known-first-party = ["smileos"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
# LangGraph nodes read keys that earlier nodes are guaranteed to have written.
reportTypedDictNotRequiredAccess = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["db: requires a Postgres database (DATABASE_URL)"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["smileos"]
omit = ["src/smileos/mcp/*"]
